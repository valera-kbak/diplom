<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дипломная работа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            transition: background 1.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }

        .links-section {
            margin: 40px 0;
            padding: 20px;
            background: rgba(240, 240, 240, 0.7);
            border-radius: 10px;
        }

        h2 {
            color: #444;
            margin-bottom: 20px;
        }

        .github-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .github-link {
            display: block;
            padding: 15px;
            background: white;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .github-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: #f8f8f8;
        }

        .background-controls {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .bg-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .bg-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .bg-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Дипломная работа</h1>
        <p class="subtitle">Тема: Разработка веб-приложения с изменяющимся фоном</p>
        
        <div class="links-section">
            <h2>Ссылки</h2>
            <div class="github-links">
                <a href="#" class="github-link" id="https://github.com/valera-kbak/diplom">Githab</a>
                <a href="#" class="github-link" id="https://www.figma.com/board/adw8Kuhn2FlfkqwqCBz9H5/Welcome-to-FigJam?node-id=0-1&p=f&t=Fizmzn5wa0hWt7Cx-0">figma</a>
                <a href="#" class="github-link" id="https://vaiera-kbak.github.io/htim1/">абучалка</a>
            </div>
        </div>
        
        <div class="background-controls">
            <button class="bg-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;" data-bg="gradient1">Градиент 1</button>
            <button class="bg-btn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;" data-bg="gradient2">Градиент 2</button>
            <button class="bg-btn" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white;" data-bg="gradient3">Градиент 3</button>
<button class="bg-btn" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white;" data-bg="gradient4">Градиент 4</button>
            <button class="bg-btn" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white;" data-bg="gradient5">Градиент 5</button>
            <button class="bg-btn" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333;" data-bg="gradient6">Светлый градиент</button>
        </div>
        
        <div class="footer">
            <p>Дипломная работа выполнена студентом [Ваше Имя]</p>
            <p>[Название университета], [Год]</p>
        </div>
    </div>

    <script>
        // Фоновые градиенты
        const backgrounds = {
            gradient1: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            gradient2: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            gradient3: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            gradient4: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            gradient5: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            gradient6: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)'
        };

        // Обработчики для кнопок выбора фона
        document.querySelectorAll('.bg-btn').forEach(button => {
            button.addEventListener('click', function() {
                const bgKey = this.getAttribute('data-bg');
                document.body.style.background = backgrounds[bgKey];
            });
        });

        // Установка начального фона
        document.body.style.background = backgrounds.gradient1;

        // Замените эти URL на реальные ссылки на ваш код
        document.getElementById('link1').href = "https://github.com/yourusername/project-main";
        document.getElementById('link2').href = "https://github.com/yourusername/project-modules";
        document.getElementById('link3').href = "https://github.com/yourusername/project-docs";
    </script>
</body>
</html>
