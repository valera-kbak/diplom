<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дипломная работа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            transition: background 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 2.5em;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .link {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-size: 1.2em;
            transition: transform 0.3s ease, background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .link:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .background-selector {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .bg-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .bg-option:hover {
            transform: scale(1.1);
        }

        /* Цвета фонов */
        .bg1 { background: linear-gradient(45deg, #667eea, #764ba2); }
        .bg2 { background: linear-gradient(45deg, #f093fb, #f5576c); }
        .bg3 { background: linear-gradient(45deg, #4facfe, #00f2fe); }
        .bg4 { background: linear-gradient(45deg, #43e97b, #38f9d7); }
        .bg5 { background: linear-gradient(45deg, #fa709a, #fee140); }
        .bg6 { background: linear-gradient(45deg, #30cfd0, #330867); }
    </style>
</head>
<body class="bg1">
    <div class="container">
        <h1>Дипломная работа</h1>
        
        <div class="links-container">
            <a href="#" class="link">Ссылка на документы</a>
            <a href="#" class="link">Ссылка на презентацию</a>
            <a href="#" class="link">Ссылка на исходный код</a>
        </div>

        <div class="background-selector">
            <div class="bg-option bg1" onclick="changeBackground('bg1')"></div>
            <div class="bg-option bg2" onclick="changeBackground('bg2')"></div>
            <div class="bg-option bg3" onclick="changeBackground('bg3')"></div>
            <div class="bg-option bg4" onclick="changeBackground('bg4')"></div>
            <div class="bg-option bg5" onclick="changeBackground('bg5')"></div>
            <div class="bg-option bg6" onclick="changeBackground('bg6')"></div>
        </div>
    </div>

    <script>
        function changeBackground(className) {
            document.body.className = className;
        }

        // Сохранение выбора фона в localStorage
        const savedBackground = localStorage.getItem('selectedBackground');
        if (savedBackground) {
            document.body.className = savedBackground;
        }
document.querySelectorAll('.bg-option').forEach(option => {
            option.addEventListener('click', (e) => {
                const className = e.target.classList[1];
                localStorage.setItem('selectedBackground', className);
            });
        });
    </script>
</body>
</html>
